<!DOCTYPE html>
<html>
<head>
    <title>Login - Marketplace Portal</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="container">
    <h2><i class="fas fa-store"></i> Marketplace Portal</h2>
    <p class="subtitle">
        Select your role to continue
    </p>
    
    <div class="role-buttons">
        <a href="/admin" class="role-btn admin">
            <i class="fas fa-user-shield"></i>
            <span>Admin</span>
            <small>Manage vendors & finances</small>
        </a>
        
        <a href="/vendor" class="role-btn vendor">
            <i class="fas fa-user-tie"></i>
            <span>Vendor</span>
            <small>Sell products & track earnings</small>
        </a>
        
        <a href="/customer" class="role-btn customer">
            <i class="fas fa-shopping-cart"></i>
            <span>Customer</span>
            <small>Shop products</small>
        </a>
    </div>
    
    <div class="info-text">
        <i class="fas fa-info-circle"></i> 
        Multi-vendor marketplace with commission system
    </div>
</div>

</body>
</html>
